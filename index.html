<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive JavaScript Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Interactive Image Gallery</h1>
    </header>

    <main>
        <!-- Khu vực ảnh lớn xem trước (Preview) -->
        <div id="image-container">
            <!-- Yêu cầu 3e & 4a: Thay đổi hình nền (background-image) của div này -->
            <div id="preview-pic"></div>
            <!-- Yêu cầu 3c & 4b: Thay đổi văn bản của div này -->
            <div id="image-text">Hover over an image below to display here.</div>
        </div>

        <!-- Danh sách các ảnh nhỏ bên dưới -->
        <div class="thumbnail-container">
            <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800" 
                 alt="A breathtaking view of planet Earth from space at night" 
                 class="thumbnail">
                 
            <img src="https://images.unsplash.com/photo-1614728263952-84ea256f9679?w=800" 
                 alt="An astronaut floating in space outside the International Space Station" 
                 class="thumbnail">
                 
            <img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=800" 
                 alt="A colorful nebula in deep space filled with bright stars" 
                 class="thumbnail">
        </div>
    </main>

    <!-- Liên kết tới file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
